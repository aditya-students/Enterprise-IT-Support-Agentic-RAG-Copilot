services:
  - type: web
    name: enterprise-it-support-copilot
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free

    healthCheckPath: /api/health

    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: TAVILY_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: industry-agentic-rag-kb
      - key: PINECONE_NAMESPACE
        value: langgraph-agentic-rag
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: APP_ENV
        value: production
      - key: ADMIN_API_KEY
        sync: false
      - key: MAX_RETRIES
        value: "1"
      - key: TOP_K
        value: "4"
      # Tell HuggingFace to use the pre-baked model cache from the Docker image
      - key: TRANSFORMERS_OFFLINE
        value: "1"
      - key: HF_HOME
        value: /app/.cache/huggingface
      - key: SENTENCE_TRANSFORMERS_HOME
        value: /app/.cache/sentence_transformers
